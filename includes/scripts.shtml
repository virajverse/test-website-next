    <script>
      // ---- Popup frequency control (localStorage) ----
      // Rules:
      //   Submit ho gaya      -> 60 din tak popup band  (df_lead_done)
      //   Sirf close kiya     -> 1 din tak popup band   (df_popup_closed)
      //   Dono clear          -> 60 sec baad auto-open
      (function () {
        var DAY = 24 * 60 * 60 * 1000;
        var LEAD_BLOCK  = 60 * DAY;   // submit ke baad
        var CLOSE_BLOCK = 1  * DAY;   // sirf close ke baad

        function isBlocked() {
          try {
            var lead = parseInt(localStorage.getItem('df_lead_done') || '0', 10);
            if (lead && (Date.now() - lead) < LEAD_BLOCK) return true;

            var closed = parseInt(localStorage.getItem('df_popup_closed') || '0', 10);
            if (closed && (Date.now() - closed) < CLOSE_BLOCK) return true;
          } catch (e) {}
          return false;
        }

        // Auto Open After 60 Seconds (sirf tab jab block na ho)
        window.addEventListener("load", function () {
          if (isBlocked()) return;
          setTimeout(function () {
            if (isBlocked()) return;      // 60 sec ke andar user ne submit/close kiya to bhi mat kholo
            if (typeof openDemoPopup === 'function') openDemoPopup();
          }, 60000);
        });
      })();
    </script>

<script id="fx-mega-js">
(function(){
  "use strict";
  function ready(fn){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', fn); else fn(); }
  ready(function(){
    /* ---- Desktop mega ---- */
    var trigger = document.querySelector('.fxm-trigger');
    var wrap = document.getElementById('fxmWrap');
    if(trigger && wrap){
      var hideT;
      function open(){ clearTimeout(hideT); wrap.classList.add('open'); }
      function scheduleClose(){ hideT = setTimeout(function(){ wrap.classList.remove('open'); }, 180); }
      trigger.addEventListener('mouseenter', open);
      trigger.addEventListener('mouseleave', scheduleClose);
      wrap.addEventListener('mouseenter', open);
      wrap.addEventListener('mouseleave', scheduleClose);
      // tab switching
      var tabs = wrap.querySelectorAll('.fxm-tab');
      var panes = wrap.querySelectorAll('.fxm-pane');
      function show(id){
        tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===id); });
        panes.forEach(function(p){ p.classList.toggle('active', p.id==='fxm-'+id); });
      }
      tabs.forEach(function(t){
        t.addEventListener('mouseenter', function(){ show(t.dataset.tab); });
        t.addEventListener('click', function(e){ e.preventDefault(); show(t.dataset.tab); });
      });
    }
 
    /* ---- Mobile sidebar ---- */
    var drawer = document.getElementById('fxsDrawer');
    var overlay = document.getElementById('fxsOverlay');
    var closeBtn = document.getElementById('fxsClose');
    var toggle = document.querySelector('.navbar-toggle');
    function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('open'); drawer.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
    function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
    if(toggle){
      // stop the theme's SlickNav from also firing
      toggle.addEventListener('click', function(e){ e.preventDefault(); e.stopImmediatePropagation(); openDrawer(); }, true);
    }
    if(overlay) overlay.addEventListener('click', closeDrawer);
    if(closeBtn) closeBtn.addEventListener('click', closeDrawer);
    // accordions
    document.querySelectorAll('.fxs-acc-head').forEach(function(h){
      h.addEventListener('click', function(){ h.parentElement.classList.toggle('open'); });
    });
    document.querySelectorAll('.fxs-subacc-head').forEach(function(h){
      h.addEventListener('click', function(){ h.parentElement.classList.toggle('open'); });
    });
    // close drawer when a real link is tapped
    drawer && drawer.querySelectorAll('a[href]:not([href="#"])').forEach(function(a){
      a.addEventListener('click', function(){ closeDrawer(); });
    });
  });
})();
</script>
    <script>
      // Safety: agar WOW.js kisi wajah se init na ho (slow/blocked), 3.5s baad
      // saare hidden .wow elements dikha do — taaki content invisible na rahe aur CLS na bigde.
      window.addEventListener('load', function () {
        setTimeout(function () {
          document.querySelectorAll('.wow').forEach(function (el) {
            var s = window.getComputedStyle(el);
            if (parseFloat(s.opacity) === 0) {
              el.style.visibility = 'visible';
              el.style.opacity = '1';
            }
          });
        }, 3500);
      });
    </script>
