[build]
  publish = "."
  command = "node build-static.js"

[[redirects]]
  from = "/api/*"
  to = "https://blogary.jupsoft.com/v1/:splat"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blogdetail.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blogdetail"
  to = "/blogdetail.html"
  status = 200

[[redirects]]
  from = "/_source_files/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
